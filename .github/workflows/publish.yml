name: Build and publish

# main  → ghcr.io/<owner>/atrium:main + :sha-<short>  (amd64), then notify the deployment repo
# v*.*.* → :<version> + :latest                      (amd64 + arm64)
# Pull requests only run checks — they never receive secrets or publish anything.
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Type-check
        run: |
          (cd server && npx tsc --noEmit -p .)
          (cd web && npx tsc --noEmit -p .)
      - name: Unit tests (no database needed)
        working-directory: server
        run: npx tsx --test src/formula.test.ts src/richmd.test.ts
      - name: Build web
        run: pnpm --filter web build

  image:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ steps.vars.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: vars
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
        if: startsWith(github.ref, 'refs/tags/v')
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.vars.outputs.image }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: ${{ startsWith(github.ref, 'refs/tags/v') && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  notify-deploy:
    # Only the canonical repo, only for main, and only if the deployment token is configured.
    needs: image
    if: github.repository == 'justinyellow/atrium' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Tell the deployment repo a new image is ready
        env:
          TOKEN: ${{ secrets.HOMELAB_DISPATCH_TOKEN }}
          IMAGE: ${{ needs.image.outputs.image }}@${{ needs.image.outputs.digest }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice::HOMELAB_DISPATCH_TOKEN is not set — image published, deployment not triggered."
            exit 0
          fi
          curl -fsS -X POST https://api.github.com/repos/justinyellow/homelab-infrastructure/dispatches \
            -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" \
            -d "$(jq -n --arg image "$IMAGE" --arg sha "$GITHUB_SHA" \
                  '{event_type:"atrium-image", client_payload:{image:$image, sha:$sha}}')"
          echo "Deployment requested for $IMAGE"
